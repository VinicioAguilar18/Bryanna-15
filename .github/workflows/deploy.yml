name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual triggers from the GitHub UI

# Needed for peaceiris/actions-gh-pages to push to gh-pages branch
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Node.js 18 with npm caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"   # Next.js 16 requires Node.js 20.9+
          cache: "npm"

      # 3. Install exact dependencies from package-lock.json
      - name: Install dependencies
        run: npm ci

      # 4. Build (next.config.ts has output:"export", produces ./out)
      - name: Build static export
        run: npm run build

      # 5. Add .nojekyll so GitHub Pages serves _next/ assets correctly
      - name: Add .nojekyll
        run: touch ./out/.nojekyll

      # 6. Deploy ./out to the gh-pages branch
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          # keep_files: false  (default — replaces branch on every deploy)
